<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>EVO-X2 TV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #bug { position: absolute; top: 18px; left: 22px; font-weight: 800; letter-spacing: .06em; font-size: 20px;
         padding: 6px 12px; border: 2px solid #fff; border-radius: 6px; background: rgba(0,0,0,.35); }
  #live { position: absolute; top: 18px; right: 22px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  #live .dot { width: 10px; height: 10px; border-radius: 50%; background: #e33; box-shadow: 0 0 8px #e33; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #title { position: absolute; left: 22px; bottom: 74px; font-size: 22px; font-weight: 700; text-shadow: 0 2px 8px #000; }
  #title small { display: block; font-size: 13px; font-weight: 400; opacity: .8; }
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(90deg, #b3001b, #7a0012);
            display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 18px; }
  #ticker span { display: inline-block; padding-left: 100vw; animation: scroll 28s linear infinite; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  #idle { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
          background: radial-gradient(circle at 50% 40%, #223 0, #000 70%); font-size: 22px; }
  #idle .bars { display: flex; height: 120px; width: 60%; }
  #idle .bars i { flex: 1; }
  #tap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); font-size: 26px; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline></video>
  <div id="idle"><div class="bars">
    <i style="background:#c0c0c0"></i><i style="background:#c0c000"></i><i style="background:#00c0c0"></i><i style="background:#00c000"></i>
    <i style="background:#c000c0"></i><i style="background:#c00000"></i><i style="background:#0000c0"></i></div>
    <div id="idletext">番組を制作中です… しばらくお待ちください</div></div>
  <div id="tap">▶ クリックで放送を開始</div>
  <div id="bug">EVO-X2 TV</div>
  <div id="live"><span class="dot"></span><span id="clock">LIVE</span></div>
  <div id="title"></div>
  <div id="ticker"><span id="tick"></span></div>
</div>
<script>
const v = document.getElementById('v'), title = document.getElementById('title'), tick = document.getElementById('tick');
const idle = document.getElementById('idle'), tap = document.getElementById('tap');
let items = [], station = {name: 'EVO-X2 TV'}, cursor = -1, playedIds = new Set();

async function refresh() {
  try {
    const r = await fetch('/playlist.json', {cache: 'no-store'});
    const j = await r.json();
    items = j.items || []; station = j.station || station;
    document.getElementById('bug').textContent = station.name || 'EVO-X2 TV';
    const caps = items.slice(-12).map(i => `【${i.program}】${i.caption}`).join('　　◆　　');
    tick.textContent = caps || `${station.tagline || ''}`;
  } catch (e) { /* server restarting */ }
}
function pickNext() {
  if (!items.length) return null;
  // newest-first preference: play unplayed clips first, then loop everything
  const unplayed = items.filter(i => !playedIds.has(i.id));
  if (unplayed.length) return unplayed[0];
  playedIds.clear();
  return items[0];
}
async function playNext() {
  await refresh();
  const it = pickNext();
  if (!it) { idle.style.display = 'flex'; setTimeout(playNext, 5000); return; }
  idle.style.display = 'none';
  playedIds.add(it.id);
  title.innerHTML = `${it.program}<small>${it.caption}　·　${it.seconds.toFixed(0)}s · seed ${it.seed} · 生成 ${it.render_s}s</small>`;
  v.src = '/clips/' + encodeURIComponent(it.file);
  const t0 = parseFloat(new URLSearchParams(location.search).get('t') || '0');   // ?t=3 → start offset (screenshots/debug)
  if (t0 > 0) v.addEventListener('loadedmetadata', () => { v.currentTime = t0; }, { once: true });
  try { await v.play(); } catch (e) { tap.style.display = 'flex'; }
}
v.addEventListener('ended', playNext);
v.addEventListener('error', () => setTimeout(playNext, 1500));
tap.addEventListener('click', () => { tap.style.display = 'none'; v.muted = false; v.play().catch(() => {}); });
setInterval(() => { const d = new Date(); document.getElementById('clock').textContent = 'LIVE ' + d.toTimeString().slice(0, 5); }, 1000);
setInterval(refresh, 30000);
playNext();
</script>
</body>
</html>
